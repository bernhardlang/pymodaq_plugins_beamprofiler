[features]
instruments = true
extensions = true
models = false
h5exporters = false
scanners = false

[urls]
package-url = 'https://github.com/bernhardlang/pymodaq_plugins_beamprofiler'

[project]
name = "pymodaq_plugins_beamprofiler"
description = 'beam profile on a 2D Cam'
dependencies = [
    "pymodaq>=5.3.2",
    "pymodaq_utils>=5.3.1",
    "pymodaq_gui>=5.3.0",
    "pymodaq_data>=5.3.0",
    "laserbeamsize",
    "colorednoise",
    #todo: list here all dependencies your package may have
]

authors = [
    {name = "Bermnhard Lang", email = "bernhard.lang@unige.ch"},
]
maintainers = [
    {name = "Bermnhard Lang", email = "bernhard.lang@unige.ch"},
]

# nottodo: leave everything below as is!

dynamic = ["version", "urls", "entry-points", "classifiers"]
readme = "README.rst"
license = { file="LICENSE" }
requires-python = ">=3.10"

[build-system]
requires = [
    "hatchling>=1.9.0",
    "hatch-vcs", "toml",
    "pymodaq_utils>=5.3.6",
]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]

[tool.hatch.version]
source = "vcs"

[tool.pymodaq]
# the "Operating System" and "Programming Language :: Python :: 3.x" classifiers are added when building the package,
# from supported_platforms in your instrument plugins and from requires-python
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
